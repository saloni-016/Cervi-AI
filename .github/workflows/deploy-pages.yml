name: Publish CerviAI landing page

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cerviai-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            frontend
            deploy/build_pages.py
          sparse-checkout-cone-mode: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the static landing page
        env:
          CERVIAI_APP_URL: ${{ vars.CERVIAI_APP_URL }}
        run: python3 deploy/build_pages.py "$RUNNER_TEMP/cerviai-pages"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/cerviai-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish the public landing page
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
