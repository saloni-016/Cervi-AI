name: Publish CerviAI demo

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Update the existing Railway service (leave off on the first run)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: cerviai-railway
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Verify the downloaded ViT weights
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          path = Path('vit_sipakmed.pth')
          pointer = subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True)
          metadata = dict(line.split(' ', 1) for line in pointer.splitlines())
          if not path.is_file() or path.stat().st_size != int(metadata['size']):
              raise SystemExit('Missing real ViT weights. Check the Git LFS object and quota.')
          with path.open('rb') as weights:
              digest = hashlib.file_digest(weights, 'sha256').hexdigest()
          if metadata['oid'] != f'sha256:{digest}':
              raise SystemExit('ViT weights do not match the Git LFS pointer.')
          PY
      - name: Build the CPU image
        run: |
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t cerviai-smoke .
      - name: Audit installed Python dependencies
        run: |
          set -euo pipefail
          # PyPI advisories use public versions, not the CPU wheel's local +cpu suffix.
          docker run --rm --network none cerviai-smoke python -m pip freeze --all \
            | sed -E 's/^(torch|torchvision)==([0-9.]+)\+cpu$/\1==\2/' > "$RUNNER_TEMP/cerviai-installed.txt"
          python3 -m venv "$RUNNER_TEMP/cerviai-audit"
          "$RUNNER_TEMP/cerviai-audit/bin/pip" install --disable-pip-version-check pip-audit==2.10.1
          "$RUNNER_TEMP/cerviai-audit/bin/pip-audit" --strict --no-deps --disable-pip \
            -r "$RUNNER_TEMP/cerviai-installed.txt"
      - name: Smoke-test Gunicorn, access control and model artifacts
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 127.0.0.1::9080 \
            -e PORT=9080 -e SECRET_KEY=offline-test-key-not-a-secret \
            -e DEMO_PASSWORD=offline-smoke-invitation cerviai-smoke)
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "=== CONTAINER STATE ==="
              docker inspect "$container" --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}} oom={{.State.OOMKilled}}' || true
              echo "=== CONTAINER LOGS ==="
              docker logs "$container" 2>&1 || true
            fi
            docker rm -f "$container" >/dev/null
          }
          trap cleanup EXIT
          port=$(docker port "$container" 9080/tcp | cut -d: -f2)
          echo "=== WAITING 30 SECONDS ==="
          sleep 30

          echo "=== PROCESSES AFTER WAIT ==="
          docker top "$container" || true

          echo "=== LOGS AFTER WAIT ==="
          docker logs "$container" 2>&1 || true
          echo "=== CONTAINER PROCESSES ==="
          docker top "$container" || true

          echo "=== CONTAINER PORTS ==="
          docker port "$container" || true

          echo "=== CONTAINER DETAILS ==="
          docker inspect "$container" --format '{{json .NetworkSettings.Ports}}'

          echo "=== HEALTH CHECK RESPONSE ==="
          curl -v --max-time 10 "http://127.0.0.1:$port/healthz" || true
          base="http://127.0.0.1:$port"
          curl --fail --silent --show-error --retry 8 --retry-connrefused --retry-delay 2 \
            --max-time 8 "$base/healthz" >/dev/null
          test "$(curl --silent --show-error --max-time 8 -o /dev/null -w '%{http_code}' "$base/")" = 401
          for path in / /static/style.css; do
            curl --fail --silent --show-error --max-time 8 -u demo:offline-smoke-invitation "$base$path" >/dev/null
          done
          docker run --rm -i --network none cerviai-smoke python - <<'PY'
          import os
          from explain_xgboost import explain_clinical_input
          from train_vit import get_model

          assert os.geteuid() != 0
          score = explain_clinical_input([30, 1, 20, 0, 0, 0, 0, 0, 0, 0, 0, 0])
          assert 0 <= score['probability'] <= 100
          get_model()  # Verify the real checkpoint loads with the CPU wheels.
          PY
      - name: Test hosted configuration and Pages artifact offline
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            --volume "$GITHUB_WORKSPACE/deploy:/app/deploy:ro" \
            --volume "$GITHUB_WORKSPACE/frontend:/app/frontend:ro" \
            cerviai-smoke python -m unittest discover -s tests -v
      - name: Publish the verified image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag cerviai-smoke "$tag"
          push_output=$(docker push "$tag" 2>&1)
          printf '%s\n' "$push_output"

          digest=$(printf '%s\n' "$push_output" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: Could not extract the image digest."
            exit 1
          fi

          image="${tag%:*}@${digest}"
          echo "Verified image: $image"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'Image tag: `%s`\n\nRegistry digest reference: `%s`\n\nCommit: `%s`\n' \
            "$tag" "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: inputs.deploy
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: railway-production
      url: ${{ steps.railway.outputs.url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: deploy
      - name: Deploy the tested image to Railway and wait for readiness
        id: railway
        env:
          CERVIAI_IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          CERVIAI_APP_URL: ${{ vars.CERVIAI_APP_URL }}
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: python3 -u -m deploy.deploy_railway
      - name: Verify Railway's public HTTPS endpoint and invitation gate
        env:
          APP_URL: ${{ steps.railway.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.railway.outputs.id }}
        run: |
          set -euo pipefail
          options=(--proto '=https' --silent --show-error --retry 5 --retry-connrefused --retry-delay 4 --max-time 15)
          if [[ "$(curl "${options[@]}" --fail --write-out ':%{http_code}' "$APP_URL/healthz")" != 'ok:200' ]]; then
            echo 'Railway reported success, but public /healthz did not return 200 ok. Check the domain, port and logs.' >&2
            exit 1
          fi
          status=$(curl "${options[@]}" --output /dev/null --write-out '%{http_code}' "$APP_URL/")
          if [[ "$status" != 401 ]]; then
            echo "Expected the invitation gate (HTTP 401), got HTTP $status. Check Railway service settings." >&2
            exit 1
          fi
          printf 'Railway deployment: `%s`\n\nApp: %s/\n\nPublic checks: `/healthz` 200; invitation required at `/`.\n' \
            "$DEPLOYMENT_ID" "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
