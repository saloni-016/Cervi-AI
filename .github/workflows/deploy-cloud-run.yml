name: Publish CerviAI demo

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Update the existing Cloud Run service (leave off on the first run)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: cerviai-cloud-run
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Verify the downloaded ViT weights
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          path = Path('vit_sipakmed.pth')
          pointer = subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True)
          metadata = dict(line.split(' ', 1) for line in pointer.splitlines())
          if not path.is_file() or path.stat().st_size != int(metadata['size']):
              raise SystemExit('Missing real ViT weights. Check the Git LFS object and quota.')
          with path.open('rb') as weights:
              digest = hashlib.file_digest(weights, 'sha256').hexdigest()
          if metadata['oid'] != f'sha256:{digest}':
              raise SystemExit('ViT weights do not match the Git LFS pointer.')
          PY
      - name: Build the CPU image
        run: |
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t cerviai-smoke .
      - name: Audit installed Python dependencies
        run: |
          set -euo pipefail
          # PyPI advisories use public versions, not the CPU wheel's local +cpu suffix.
          docker run --rm --network none cerviai-smoke python -m pip freeze --all \
            | sed -E 's/^(torch|torchvision)==([0-9.]+)\+cpu$/\1==\2/' > "$RUNNER_TEMP/cerviai-installed.txt"
          python3 -m venv "$RUNNER_TEMP/cerviai-audit"
          "$RUNNER_TEMP/cerviai-audit/bin/pip" install --disable-pip-version-check pip-audit==2.10.1
          "$RUNNER_TEMP/cerviai-audit/bin/pip-audit" --strict --no-deps --disable-pip \
            -r "$RUNNER_TEMP/cerviai-installed.txt"
      - name: Smoke-test Gunicorn, access control and model artifacts
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 127.0.0.1::9080 \
            -e PORT=9080 -e SECRET_KEY=offline-test-key-not-a-secret \
            -e DEMO_PASSWORD=offline-smoke-invitation cerviai-smoke)
          cleanup() {
            if [ "$?" -ne 0 ]; then docker logs "$container"; fi
            docker rm -f "$container" >/dev/null
          }
          trap cleanup EXIT
          port=$(docker port "$container" 9080/tcp | cut -d: -f2)
          base="http://127.0.0.1:$port"
          curl --fail --silent --show-error --retry 8 --retry-connrefused --retry-delay 2 \
            --max-time 8 "$base/healthz" >/dev/null
          test "$(curl --silent --show-error --max-time 8 -o /dev/null -w '%{http_code}' "$base/")" = 401
          for path in / /static/style.css; do
            curl --fail --silent --show-error --max-time 8 -u demo:offline-smoke-invitation "$base$path" >/dev/null
          done
          docker run --rm -i --network none cerviai-smoke python - <<'PY'
          import os
          from explain_xgboost import explain_clinical_input
          from train_vit import get_model

          assert os.geteuid() != 0
          score = explain_clinical_input([30, 1, 20, 0, 0, 0, 0, 0, 0, 0, 0, 0])
          assert 0 <= score['probability'] <= 100
          get_model()  # Verify the real checkpoint loads with the CPU wheels.
          PY
      - name: Publish the verified image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag cerviai-smoke "$tag"
          docker push "$tag"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")
          [[ "$image" == "${tag%:*}@"* && "${image##*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'Image: `%s`\n\nRepository ID: `%s`\n\nOwner ID: `%s`\n\nBranch: `%s`\n' \
            "$image" "$GITHUB_REPOSITORY_ID" "$OWNER_ID" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: inputs.deploy
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deployment settings
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          if [[ -z "$PROJECT_ID" || -z "$WIF_PROVIDER" || -z "$DEPLOYER_SA" ]]; then
            echo 'Set the three GitHub repository variables in Step 6 of instructions.txt.' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Deploy the published image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          suffix="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run services update cerviai-demo --image="$IMAGE" --no-traffic --deploy-health-check \
            --revision-suffix="$suffix" --project="$PROJECT_ID" --region=us-central1 --quiet
          gcloud run services update-traffic cerviai-demo --to-revisions="cerviai-demo-$suffix=100" \
            --project="$PROJECT_ID" --region=us-central1 --quiet
          url=$(gcloud run services describe cerviai-demo --format='value(status.url)' \
            --project="$PROJECT_ID" --region=us-central1)
          printf 'Cloud Run service: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
